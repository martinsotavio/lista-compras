name: leitor_ean
description: "Lista de compras em família: lê o código de barras, mostra o produto e divide a lista com a casa."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  mobile_scanner: ^7.4.3
  shared_preferences: ^2.5.6
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true
